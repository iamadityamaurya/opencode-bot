[server]
base_url = "http://127.0.0.1:4096"
connect_timeout_seconds = 5
request_timeout_seconds = 600

[projects]
default = "code"

[projects.code]
path = "/home/aditys/code"
description = "Main Code Directory"

[projects.opencode-bot]
path = "/home/aditys/code/opencode_extension/opencode-bot"
description = "OpenCode Telegram Bot repository"

[bot]
max_active_tasks_per_session = 1
progress_update_interval_seconds = 5
max_telegram_message_length = 4000
# How often (seconds) a running task's acknowledgement message may be edited
# with live tool/step progress. 0 effectively disables live progress edits.
progress_edit_interval_seconds = 3
# Pin a self-updating status message per chat. Set to 0 to disable.
heartbeat_interval_seconds = 60
# React to task messages with 👀 / ✅ / ❌ / 🛑.
enable_reactions = true
